version: "3.8"

services:
  carga-flow-api:
    build: .
    container_name: carga-flow-api
    restart: unless-stopped
    ports:
      - "3008:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    volumes:
      - ./certs:/opt/carga-flow/certs:ro
    labels:
      - cargaflow.autoheal=true
    # Si /api no responde en 5s, marca unhealthy (visible en `docker ps`).
    # 200/401/404 son todas válidas — significa que el server contesta.
    # Auto-restart de containers unhealthy queda pendiente: pendía de
    # willfarrell/autoheal, que Docker Hub rechazó al pull desde el VPS.
    # Por ahora basta con que healthcheck deje visible el estado.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/api', r => process.exit(0)).on('error', () => process.exit(1)).setTimeout(5000, function() { this.destroy(); process.exit(1); })"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
